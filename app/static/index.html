<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagewise</title>
<style>
  :root {
    --bg: #fbfaf6;
    --side: #f6f5ee;
    --line: #e9e7dc;
    --ink: #2f352e;
    --muted: #8b9087;
    --green: #4a7a60;
    --tint: #eef3e9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.6;
  }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  /* ----- Sidebar ----- */
  aside {
    width: 262px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line);
    padding: 24px 16px; overflow-y: auto;
  }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: -.01em; padding: 0 8px 18px; }
  .brand span { color: var(--green); }
  .new {
    width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    color: var(--green); font-size: 14px; background: var(--bg); transition: background .15s;
  }
  .new:hover { background: var(--tint); }
  h2 { margin: 26px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .item {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; color: #4a5148;
  }
  .item:hover { background: rgba(74,122,96,.07); }
  .item.active { background: var(--tint); color: var(--ink); }
  .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .x { opacity: 0; color: var(--muted); padding: 0 4px; font-size: 15px; }
  .item:hover .x { opacity: 1; } .item .x:hover { color: #b04a4a; }
  .note { padding: 4px 8px; font-size: 13px; color: var(--muted); }

  .pick { display: block; margin: 0 8px; font-size: 13.5px; color: var(--green); cursor: pointer; }
  .pick:hover { text-decoration: underline; }
  .pick input { display: none; }
  .go-up { margin: 8px 8px 0; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; background: var(--bg); }
  .go-up:hover { background: var(--tint); }
  #status { margin: 8px 8px 0; font-size: 12px; color: var(--muted); }
  .doc { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 13px; border-radius: 8px; }
  .doc:hover { background: rgba(74,122,96,.07); }
  .doc .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc small { color: var(--muted); display: block; font-size: 11.5px; }
  .doc .x { opacity: 0; color: var(--muted); font-size: 12px; }
  .doc:hover .x { opacity: 1; } .doc .x:hover { color: #b04a4a; }

  /* ----- Main ----- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 36px 24px 12px; }
  .col { max-width: 720px; margin: 0 auto; }

  .welcome { text-align: center; padding-top: 14vh; }
  .welcome h3 { margin: 0 0 8px; font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
  .welcome p { margin: 0 0 24px; color: var(--muted); }
  .chips { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 13.5px; color: #55604f; }
  .chip:hover { background: var(--tint); }

  .msg { margin-bottom: 26px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .b { background: var(--tint); padding: 9px 16px; border-radius: 16px 16px 4px 16px; max-width: 80%; white-space: pre-wrap; }
  .msg.bot .b { white-space: pre-wrap; word-wrap: break-word; }
  .cite { color: var(--green); font-size: 11.5px; font-weight: 600; vertical-align: super; margin: 0 1px; }

   .sources { margin-top: 10px; }
  .s-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 2px 0; text-align: left; }
  .s-toggle:hover { color: var(--green); }
  .s-toggle .arrow { font-size: 9px; transition: transform .15s; }
  .sources.open .arrow { transform: rotate(90deg); }
  .s-list { display: none; margin-top: 8px; }
  .sources.open .s-list { display: block; }
  .passage { margin-bottom: 8px; padding: 10px 14px; background: var(--side); border-radius: 10px; font-size: 13px; color: #5d665a; white-space: pre-wrap; }
  .passage b { display: block; margin-bottom: 4px; color: var(--green); font-weight: 600; }
  .time { margin-top: 4px; font-size: 11.5px; color: var(--muted); }

  .dots { display: flex; gap: 4px; padding: 6px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); opacity: .3; animation: bl 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes bl { 0%,80%,100% { opacity: .2; } 40% { opacity: .9; } }

  /* ----- Input ----- */
  .composer { padding: 8px 24px 20px; }
  .composer form {
    max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 6px 6px 16px;
  }
  .composer form:focus-within { border-color: var(--green); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; color: var(--ink); background: transparent; padding: 8px 0; max-height: 140px; }
  .send { width: 36px; height: 36px; border-radius: 10px; background: var(--green); color: #fff; display: grid; place-items: center; }
  .send:hover { opacity: .88; } .send:disabled { opacity: .45; cursor: wait; }
  .hint { max-width: 720px; margin: 8px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }

  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  @media (max-width: 800px) {
    body { flex-direction: column; }
    aside { width: 100%; max-height: 36vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #log, .composer { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<aside>
  <div class="brand">Page<span>wise</span></div>
  <button class="new" onclick="newChat()">+ New chat</button>

  <h2>Chats</h2>
  <div id="chats"><div class="note">No chats yet</div></div>

  <h2>Documents</h2>
  <label class="pick">
    <input type="file" id="file" accept=".pdf,.txt,.md" onchange="fileChosen()">
    <span id="pickText">Choose a file...</span>
  </label>
  <button class="go-up" onclick="upload()">Upload</button>
  <div id="status"></div>
  <div id="docs" style="margin-top:10px"></div>
</aside>

<main>
  <div id="log"><div class="col" id="col"></div></div>
  <div class="composer">
    <form onsubmit="send(event)">
      <textarea id="q" rows="1" placeholder="Ask about your documents" onkeydown="keyHandler(event)" oninput="grow(this)"></textarea>
      <button class="send" id="go" title="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </form>
    <div class="hint">Pagewise answers only from your uploaded files.</div>
  </div>
</main>

<script>
let sid = localStorage.getItem("sid") || null;
const col = document.getElementById("col"), log = document.getElementById("log");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
const down = () => { log.scrollTop = log.scrollHeight; };
function grow(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; }
function keyHandler(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e); } }

function welcome() {
  col.innerHTML = `<div class="welcome">
    <h3>What would you like to know?</h3>
    <p>Ask anything from your uploaded documents.</p>
    <div class="chips">
      <button class="chip" onclick="ask(this.textContent)">What is the formula for Newton's second law?</button>
      <button class="chip" onclick="ask(this.textContent)">Which pigment absorbs sunlight in leaves?</button>
      <button class="chip" onclick="ask(this.textContent)">How do you create a dictionary in Python?</button>
    </div></div>`;
}
function clearWelcome() { const w = col.querySelector(".welcome"); if (w) w.remove(); }

function addUser(text) {
  clearWelcome();
  const d = document.createElement("div"); d.className = "msg user";
  d.innerHTML = `<div class="b">${esc(text)}</div>`; col.appendChild(d); down();
}
function sourcesHTML(src, secs) {
  let h = "";
  if (src && src.length) {
    const top = src[0].score, seen = new Set(), files = [];
    src.filter(s => s.score >= top - 0.15).forEach(s => {      // only the strong matches
      const k = s.source + "|" + s.page;
      if (!seen.has(k)) { seen.add(k); files.push(`${esc(s.source)} &middot; p.${s.page}`); }
    });
    h += `<div class="sources">
      <button class="s-toggle" onclick="this.parentElement.classList.toggle('open')">
        <span class="arrow">&#9654;</span> Sources: ${files.join(", ")}</button>
      <div class="s-list">` +
      src.map(s => `<div class="passage"><b>[${s.id}] ${esc(s.source)} &middot; page ${s.page}</b>${esc(s.snippet)}</div>`).join("") +
      `</div></div>`;
  }
  return h + (secs ? `<div class="time">${secs}s</div>` : "");
}
function addBot(answer, src, secs) {
  clearWelcome();
  const d = document.createElement("div"); d.className = "msg bot";
  d.innerHTML = `<div class="b">${fmt(answer)}</div>${sourcesHTML(src, secs)}`;
  col.appendChild(d); down(); return d;
}
function addTyping() {
  clearWelcome();
  const d = document.createElement("div"); d.className = "msg bot";
  d.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>'; col.appendChild(d); down(); return d;
}

function ask(t) { document.getElementById("q").value = t; send(new Event("submit")); }
async function send(e) {
  e.preventDefault();
  const q = document.getElementById("q"), go = document.getElementById("go"), text = q.value.trim();
  if (!text) return;
  q.value = ""; grow(q); addUser(text); go.disabled = true;
  const wait = addTyping();
  try {
    const r = await fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, session_id: sid})});
    const j = await r.json(); wait.remove();
    if (!r.ok) addBot("Sorry, something went wrong: " + (j.detail || r.statusText));
    else { sid = j.session_id; localStorage.setItem("sid", sid); addBot(j.answer, j.sources, j.seconds); loadChats(); }
  } catch (err) { wait.remove(); addBot("The server is not reachable. Please check that it is running."); }
  go.disabled = false; q.focus();
}

async function loadChats() {
  const box = document.getElementById("chats");
  try {
    const r = await fetch("/sessions"); if (!r.ok) throw 0;
    const list = await r.json();
    box.innerHTML = list.length ? "" : '<div class="note">No chats yet</div>';
    list.forEach(c => {
      const el = document.createElement("div");
      el.className = "item" + (c.session_id === sid ? " active" : "");
      el.innerHTML = `<span class="t" title="${esc(c.title)}">${esc(c.title)}</span>`;
      el.onclick = () => openChat(c.session_id);
      const b = document.createElement("button"); b.className = "x"; b.textContent = "\u00d7"; b.title = "Delete chat";
      b.onclick = async ev => { ev.stopPropagation(); await fetch("/history/" + c.session_id, {method: "DELETE"});
        if (c.session_id === sid) newChat(); else loadChats(); };
      el.appendChild(b); box.appendChild(el);
    });
  } catch (e) { box.innerHTML = '<div class="note">Chat list unavailable. Restart the server after adding /sessions.</div>'; }
}
async function openChat(id) {
  sid = id; localStorage.setItem("sid", sid); col.innerHTML = "";
  const r = await fetch("/history/" + sid), msgs = r.ok ? await r.json() : [];
  if (!msgs.length) welcome();
  msgs.forEach(m => m.role === "user" ? addUser(m.content) : addBot(m.content, m.sources));
  loadChats();
}
function newChat() { sid = null; localStorage.removeItem("sid"); welcome(); loadChats(); document.getElementById("q").focus(); }

function fileChosen() {
  const f = document.getElementById("file").files[0];
  document.getElementById("pickText").textContent = f ? f.name : "Choose a file...";
}
async function loadDocs() {
  const box = document.getElementById("docs"), docs = await (await fetch("/documents")).json();
  box.innerHTML = docs.length ? "" : '<div class="note">No documents yet</div>';
  docs.forEach(d => {
    const el = document.createElement("div"); el.className = "doc";
    el.innerHTML = `<div class="n" title="${esc(d.name)}">${esc(d.name)}<small>${d.chunks} chunks</small></div>`;
    const b = document.createElement("button"); b.className = "x"; b.textContent = "Delete";
    b.onclick = async () => { await fetch("/documents/" + encodeURIComponent(d.name), {method: "DELETE"}); loadDocs(); };
    el.appendChild(b); box.appendChild(el);
  });
}
async function upload() {
  const st = document.getElementById("status"), input = document.getElementById("file"), f = input.files[0];
  if (!f) { st.textContent = "Choose a file first."; return; }
  st.textContent = "Processing...";
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch("/documents/upload", {method: "POST", body: fd}), j = await r.json();
    st.textContent = r.ok ? `${j.file}: ${j.status} (${j.chunks} chunks)` : "Failed: " + j.detail;
    if (r.ok) { input.value = ""; fileChosen(); }
  } catch (e) { st.textContent = "Server not reachable."; }
  loadDocs();
}

if (sid) openChat(sid); else { welcome(); loadChats(); }
loadDocs();
</script>
</body>
</html>
